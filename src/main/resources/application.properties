spring.application.name=abarrotes-eltrebol
server.port=8080

# Persistencia H2 en archivo local (modo compatibilidad MySQL)
spring.datasource.url=jdbc:h2:file:./data/eltrebol_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 para inspeccion en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JWT (lee variable de entorno o usa valor por defecto local)
app.jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaAbarrotesElTrebol2026JWT!}
app.jwt.expiration-ms=28800000